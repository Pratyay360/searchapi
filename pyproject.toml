[project]
name = "searchweb"
version = "0.3.0"
description = "A SearXNG-style meta search API with REST and MCP interfaces"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi[standard]>=0.121.3",
  "fastapi-cloud>=0.0.1",
  "fastapi-mcp>=0.4.0",
  "habanero>=2.3.0",
  "httpx>=0.27.0",
  "lxml>=6.1.1",
  "pyrefly>=1.1.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = { find = { where = ["."], include = ["src*"] } }
include-package-data = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
